<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Спорт</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--fg:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#888);
--card:var(--tg-theme-secondary-bg-color,#f1f1f4);--acc:var(--tg-theme-button-color,#2a8bf2);--acc-fg:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}.hint{color:var(--hint);font-size:14px;margin-bottom:18px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.q{background:var(--card);border-radius:14px;padding:16px 0;text-align:center;font-size:22px;font-weight:600;cursor:pointer;border:2px solid transparent;user-select:none}
.q.sel{border-color:var(--acc)}
.step{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:18px}
.step button{width:56px;height:56px;border-radius:50%;border:0;background:var(--card);color:var(--fg);font-size:28px}
.num{font-size:44px;font-weight:700;min-width:90px;text-align:center}
button.done{margin-top:22px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--acc-fg);font-size:16px}
button.done:disabled{opacity:.35}
.result{margin-top:16px;padding:12px;border-radius:12px;background:var(--card);display:none}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-weight:600;cursor:pointer;user-select:none}
.tab.on{background:var(--bg)}.pane{display:none}.pane.on{display:block}
.opt{color:var(--hint);font-size:14px;margin:16px 0 8px}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.e{background:var(--card);border-radius:14px;padding:6px 8px 10px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;border:2px solid transparent;user-select:none}
.e.sel{border-color:var(--acc)}.e svg{display:block;background:#fff;border-radius:10px;margin-bottom:6px}
.e small{display:block;font-weight:400;color:var(--hint);font-size:11px}#plankbox{display:none}
</style></head><body>
<div class="tabs"><div class="tab on" data-p="pu">💪 Отжимания</div><div class="tab" data-p="abs">🔥 Пресс</div></div>
<div class="pane on" id="pu">
<div class="hint">Выбери или подкрути число и нажми «Готово» — запишу</div>
<div class="quick" id="quick"></div>
<div class="step"><button id="minus">−</button><div class="num" id="num">—</div><button id="plus">+</button></div>
<button class="done" id="done" disabled>Готово</button>
</div>
<div class="pane" id="abs">
<div class="hint">Отметь, что сделал сегодня</div>
<div class="ex" id="ex"></div>
<div id="plankbox"><div class="opt">Планку держал, сек (не обязательно):</div>
<div class="quick" id="pquick"></div>
<div class="step"><button id="pminus">−</button><div class="num" id="pnum">—</div><button id="pplus">+</button></div></div>
<button class="done" id="absdone" disabled>Готово</button>
</div>
<div class="result" id="result"></div>
<script>
let n=0;const quick=[15,20,25,30];
const q=document.getElementById('quick');
function render(){document.getElementById('num').textContent=n||'—';document.getElementById('done').disabled=!n;
 document.querySelectorAll('.q').forEach(b=>b.classList.toggle('sel',+b.dataset.v===n))}
quick.forEach(v=>{const b=document.createElement('div');b.className='q';b.dataset.v=v;b.textContent=v;
 b.onclick=()=>{n=(n===v)?0:v;try{Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}render()};q.appendChild(b)});
document.getElementById('minus').onclick=()=>{n=Math.max(0,n-1);render()};
document.getElementById('plus').onclick=()=>{n=Math.min(200,n+1);render()};
function send(text){const r=document.getElementById('result');r.style.display='block';
 const fromKeyboard=window.Telegram&&Telegram.WebApp.initData!==undefined&&!Telegram.WebApp.initDataUnsafe.query_id&&Telegram.WebApp.platform!=='unknown';
 try{if(!fromKeyboard)throw 0;Telegram.WebApp.sendData(text)}catch(x){r.textContent='Отсюда отправить нельзя — открой через кнопку «💪 Спорт» внизу чата. Или напиши боту: «'+text+'»'}}
document.getElementById('done').onclick=()=>{if(n)send('отжимания: '+n)};
let p=0;const pq=document.getElementById('pquick');
function prender(){document.getElementById('pnum').textContent=p||'—';
 document.querySelectorAll('#pquick .q').forEach(b=>b.classList.toggle('sel',+b.dataset.v===p))}
[20,30,45,60].forEach(v=>{const b=document.createElement('div');b.className='q';b.dataset.v=v;b.textContent=v;
 b.onclick=()=>{p=(p===v)?0:v;try{Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}prender()};pq.appendChild(b)});
document.getElementById('pminus').onclick=()=>{p=Math.max(0,p-5);prender()};
document.getElementById('pplus').onclick=()=>{p=Math.min(600,p+5);prender()};
const EX=[{"k": "plank", "n": "Планка", "t": "основа", "svg": "<svg viewBox=\"0 0 300 165\" width=\"100%\"><line x1=\"8\" y1=\"155\" x2=\"292\" y2=\"155\" stroke=\"#bbb\" stroke-width=\"3\"/><line x1=\"212\" y1=\"98\" x2=\"208\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"208\" y1=\"150\" x2=\"243\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"130\" y1=\"104\" x2=\"85\" y2=\"126\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"85\" y1=\"126\" x2=\"42\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"212\" y1=\"98\" x2=\"130\" y2=\"104\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><line x1=\"212\" y1=\"98\" x2=\"205\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"205\" y1=\"150\" x2=\"240\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"130\" y1=\"104\" x2=\"85\" y2=\"126\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"85\" y1=\"126\" x2=\"42\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"212\" y1=\"98\" x2=\"130\" y2=\"104\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"232\" cy=\"88\" r=\"15\" fill=\"#37474f\"/></svg>"}, {"k": "deadbug", "n": "Мёртвый жук", "t": "основа", "svg": "<svg viewBox=\"0 0 300 165\" width=\"100%\"><line x1=\"8\" y1=\"155\" x2=\"292\" y2=\"155\" stroke=\"#bbb\" stroke-width=\"3\"/><line x1=\"68\" y1=\"138\" x2=\"74\" y2=\"95\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"74\" y1=\"95\" x2=\"76\" y2=\"55\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"138\" x2=\"154\" y2=\"80\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"154\" y1=\"80\" x2=\"204\" y2=\"80\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"68\" y1=\"138\" x2=\"150\" y2=\"138\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><line x1=\"68\" y1=\"138\" x2=\"40\" y2=\"110\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"110\" x2=\"10\" y2=\"120\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"138\" x2=\"195\" y2=\"115\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"195\" y1=\"115\" x2=\"245\" y2=\"125\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"68\" y1=\"138\" x2=\"150\" y2=\"138\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"45\" cy=\"135\" r=\"15\" fill=\"#37474f\"/></svg>"}, {"k": "revcrunch", "n": "Обратные скручивания", "t": "основа", "svg": "<svg viewBox=\"0 0 300 165\" width=\"100%\"><line x1=\"8\" y1=\"155\" x2=\"292\" y2=\"155\" stroke=\"#bbb\" stroke-width=\"3\"/><line x1=\"68\" y1=\"138\" x2=\"104\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"104\" y1=\"150\" x2=\"134\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"126\" x2=\"112\" y2=\"78\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"112\" y1=\"78\" x2=\"162\" y2=\"62\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"68\" y1=\"138\" x2=\"150\" y2=\"126\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><line x1=\"68\" y1=\"138\" x2=\"100\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"100\" y1=\"150\" x2=\"130\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"150\" y1=\"126\" x2=\"108\" y2=\"78\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"108\" y1=\"78\" x2=\"158\" y2=\"62\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"68\" y1=\"138\" x2=\"150\" y2=\"126\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"45\" cy=\"135\" r=\"15\" fill=\"#37474f\"/></svg>"}, {"k": "crunch", "n": "Скручивания", "t": "по желанию", "svg": "<svg viewBox=\"0 0 300 165\" width=\"100%\"><line x1=\"8\" y1=\"155\" x2=\"292\" y2=\"155\" stroke=\"#bbb\" stroke-width=\"3\"/><line x1=\"92\" y1=\"114\" x2=\"115\" y2=\"110\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"115\" y1=\"110\" x2=\"103\" y2=\"118\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"155\" y1=\"142\" x2=\"199\" y2=\"95\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"199\" y1=\"95\" x2=\"236\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"114\" x2=\"155\" y2=\"142\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"114\" x2=\"112\" y2=\"112\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"112\" y1=\"112\" x2=\"100\" y2=\"120\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"155\" y1=\"142\" x2=\"195\" y2=\"95\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"195\" y1=\"95\" x2=\"232\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"114\" x2=\"155\" y2=\"142\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"70\" cy=\"98\" r=\"15\" fill=\"#37474f\"/></svg>"}, {"k": "sideplank", "n": "Боковая планка", "t": "по желанию", "svg": "<svg viewBox=\"0 0 300 165\" width=\"100%\"><line x1=\"8\" y1=\"155\" x2=\"292\" y2=\"155\" stroke=\"#bbb\" stroke-width=\"3\"/><line x1=\"84\" y1=\"84\" x2=\"86\" y2=\"50\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"86\" y1=\"50\" x2=\"88\" y2=\"12\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"165\" y1=\"114\" x2=\"210\" y2=\"130\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"210\" y1=\"130\" x2=\"255\" y2=\"146\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"84\" y1=\"84\" x2=\"165\" y2=\"114\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><line x1=\"84\" y1=\"84\" x2=\"84\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"84\" y1=\"150\" x2=\"112\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"165\" y1=\"114\" x2=\"208\" y2=\"132\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"208\" y1=\"132\" x2=\"252\" y2=\"150\" stroke=\"#37474f\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"84\" y1=\"84\" x2=\"165\" y2=\"114\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"62\" cy=\"72\" r=\"15\" fill=\"#37474f\"/></svg>"}, {"k": "birddog", "n": "Птица-собака", "t": "по желанию", "svg": "<svg viewBox=\"0 0 300 165\" width=\"100%\"><line x1=\"8\" y1=\"155\" x2=\"292\" y2=\"155\" stroke=\"#bbb\" stroke-width=\"3\"/><line x1=\"90\" y1=\"88\" x2=\"92\" y2=\"119\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"92\" y1=\"119\" x2=\"92\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"175\" y1=\"88\" x2=\"175\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"175\" y1=\"150\" x2=\"222\" y2=\"150\" stroke=\"#9aa7ae\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"90\" y1=\"88\" x2=\"175\" y2=\"88\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><line x1=\"90\" y1=\"88\" x2=\"50\" y2=\"84\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"50\" y1=\"84\" x2=\"12\" y2=\"78\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"175\" y1=\"88\" x2=\"220\" y2=\"88\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"220\" y1=\"88\" x2=\"268\" y2=\"86\" stroke=\"#e65100\" stroke-width=\"9\" stroke-linecap=\"round\"/><line x1=\"90\" y1=\"88\" x2=\"175\" y2=\"88\" stroke=\"#37474f\" stroke-width=\"11\" stroke-linecap=\"round\"/><circle cx=\"64\" cy=\"78\" r=\"15\" fill=\"#37474f\"/></svg>"}];const chosen=new Set();const exb=document.getElementById('ex');
function erender(){document.querySelectorAll('.e').forEach(b=>b.classList.toggle('sel',chosen.has(b.dataset.k)));
 document.getElementById('plankbox').style.display=chosen.has('plank')?'block':'none';document.getElementById('absdone').disabled=!chosen.size}
EX.forEach(x=>{const b=document.createElement('div');b.className='e';b.dataset.k=x.k;b.innerHTML=x.svg+x.n+'<small>'+x.t+'</small>';
 b.onclick=()=>{chosen.has(x.k)?chosen.delete(x.k):chosen.add(x.k);try{Telegram.WebApp.HapticFeedback.selectionChanged()}catch(e){}erender()};exb.appendChild(b)});
document.getElementById('absdone').onclick=()=>{if(!chosen.size)return;
 send('пресс: '+EX.filter(x=>chosen.has(x.k)).map(x=>x.k==='plank'&&p?'планка '+p+' сек':x.n.toLowerCase()).join(', '))};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
 document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===t.dataset.p));document.getElementById('result').style.display='none'});
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
render();prender();erender();
</script></body></html>
